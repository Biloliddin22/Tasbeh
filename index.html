<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4CAF50">
  <link rel="icon" href="Tasbeh.ico">
  <link rel="manifest" href="manifest.json">
  <!-- The startup screen must paint while the stylesheet and scripts are still downloading. -->
  <style>
    #startupLoader { display: none; }
    .app-loading { background: #fefce8; }
    .app-loading[data-theme="dark"] { background: #15231a; }
    .app-loading body > :not(#startupLoader) { visibility: hidden; }
    .app-loading #startupLoader {
      --loader-accent: #147a41;
      --loader-shine: #fffef6;
      --loader-delay: 450ms;
      position: fixed;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 9px;
      color: var(--loader-accent);
      font: 750 2rem/1.1 system-ui, sans-serif;
      letter-spacing: -.035em;
      visibility: hidden;
      animation: startup-reveal 0s var(--loader-delay) forwards;
    }
    .app-loading[data-theme="dark"] #startupLoader {
      --loader-accent: #a9e5b6;
      --loader-shine: #e6f0df;
    }
    #startupLoader span {
      background: linear-gradient(110deg, var(--loader-accent) 32%, var(--loader-shine) 48%, var(--loader-accent) 64%) 100% / 250% 100%;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: startup-shimmer 2.2s var(--loader-delay) ease-in-out infinite;
    }
    #startupLoader::after {
      content: "";
      width: 25px;
      height: 4px;
      border-radius: 999px;
      background: currentColor;
      animation: startup-breathe 2.2s var(--loader-delay) ease-in-out infinite;
    }
    @keyframes startup-reveal { to { visibility: visible; } }
    @keyframes startup-shimmer {
      0%, 15% { background-position: 100% 50%; }
      75%, 100% { background-position: 0% 50%; }
    }
    @keyframes startup-breathe {
      0%, 100% { transform: scaleX(.7); opacity: .55; }
      50% { transform: scaleX(1.5); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #startupLoader span, #startupLoader::after { animation: none; }
    }
  </style>
  <script>
    (() => {
      const root = document.documentElement;
      root.classList.add("app-loading");
      try {
        if (JSON.parse(localStorage.getItem("tasbeh.prefs"))?.theme === "dark") {
          root.dataset.theme = "dark";
        }
      } catch {
        // The default light palette also works without access to preferences.
      }

      let stylesReady = false;
      let scriptsReady = false;

      function finishStartup() {
        if (!stylesReady || !scriptsReady) return;
        root.classList.remove("app-loading");
        document.dispatchEvent(new Event("tasbeh:ready"));
      }

      function onStylesSettled(event) {
        if (event.target.id !== "appStyles") return;
        document.removeEventListener("load", onStylesSettled, true);
        document.removeEventListener("error", onStylesSettled, true);
        event.target.media = "all";
        stylesReady = true;
        finishStartup();
      }

      document.addEventListener("load", onStylesSettled, true);
      document.addEventListener("error", onStylesSettled, true);
      document.addEventListener("DOMContentLoaded", () => {
        scriptsReady = true;
        finishStartup();
      }, { once: true });
    })();
  </script>
  <link id="appStyles" rel="stylesheet" href="style.css" media="print">
  <noscript><link rel="stylesheet" href="style.css"></noscript>
  <script src="zikr.js" defer></script>
  <script src="translations.js" defer></script>
  <script src="main.js" defer></script>
  <title>Tasbeh</title>
</head>
<body>
  <div id="startupLoader" role="status"><span>Tasbeh</span></div>
  <main class="app">
    <header class="app-header">
      <h1>Tasbeh</h1>
      <div class="header-actions">
        <div class="mode-switch segmented" role="group" aria-label="Counting mode" data-i18n-label="countingMode">
          <button id="freestyleMode" type="button" aria-pressed="true" data-i18n="freestyle">Freestyle</button>
          <button id="dailyMode" type="button" aria-pressed="false" data-i18n="daily">Daily</button>
        </div>
        <details id="optionsMenu">
          <summary id="optionsToggle" aria-label="Options" title="Options" data-i18n-label="options">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <circle cx="5" cy="12" r="1.6"/>
              <circle cx="12" cy="12" r="1.6"/>
              <circle cx="19" cy="12" r="1.6"/>
            </svg>
          </summary>
          <div class="options-panel">
            <div class="options-quick">
              <button id="themeToggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
                <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20.5 14.3A8.8 8.8 0 0 1 9.7 3.5 8.8 8.8 0 1 0 20.5 14.3Z"/>
                </svg>
                <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="4"/>
                  <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
                </svg>
              </button>
              <button id="resetCycles" type="button" data-i18n="resetCycles">Reset cycles</button>
            </div>
            <button class="options-link" type="button" data-open-page="guidePage" aria-haspopup="dialog">
              <span aria-hidden="true">?</span><span data-i18n="guide">Guide</span>
            </button>
            <button class="options-link" type="button" data-open-page="aboutPage" aria-haspopup="dialog">
              <span aria-hidden="true">i</span><span data-i18n="about">About</span>
            </button>
            <div class="options-language">
              <div class="language-switch segmented" role="group" aria-label="Language" data-i18n-label="language">
                <button type="button" lang="uz" aria-label="O‘zbekcha" aria-pressed="false" data-language="uz">UZ</button>
                <button type="button" lang="ru" aria-label="Русский" aria-pressed="false" data-language="ru">RU</button>
                <button type="button" lang="en" aria-label="English" aria-pressed="true" data-language="en">EN</button>
              </div>
            </div>
          </div>
        </details>
      </div>
    </header>

    <div class="controls" id="freestyleControls">
      <label class="select-field">
        <span data-i18n="zikr">Zikr</span>
        <select id="zikrSelect">
          <button type="button"><selectedcontent></selectedcontent></button>
        </select>
      </label>
      <label class="select-field">
        <span data-i18n="limit">Limit</span>
        <select id="limitSelect">
          <button type="button"><selectedcontent></selectedcontent></button>
          <option value="11">11</option>
          <option value="33">33</option>
          <option value="99">99</option>
          <option value="1000">1000</option>
        </select>
      </label>
    </div>
    <button class="daily-open" id="openDaily" type="button" aria-haspopup="dialog" hidden>
      <span data-i18n="dailyZikr">Daily zikr</span>
      <span id="dailyPreview"></span>
    </button>

    <section class="zikr-display" aria-label="Current zikr" data-i18n-label="currentZikr">
      <p id="zikrText" aria-live="polite"></p>
    </section>

    <div class="counter-panel">
      <button id="counter" type="button" aria-label="Count">
        <span id="count">0</span>
        <span class="counter-meta" aria-hidden="true">
          <span id="counterLimit">/ 33</span>
          <span class="counter-divider"></span>
          <span id="cycles">× 0</span>
        </span>
      </button>
      <button id="reset" type="button" aria-label="Reset current count" title="Reset current count" data-i18n-label="resetCount">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 4v6h-6M19.2 10a8 8 0 1 0 .3 4"/>
        </svg>
      </button>
    </div>
  </main>

  <dialog id="dailyMenu" aria-labelledby="dailyTitle">
    <div class="dialog-header">
      <h2 id="dailyTitle" data-i18n="dailyZikr">Daily zikr</h2>
      <form method="dialog">
        <button class="close-menu" type="submit" aria-label="Close daily menu" data-i18n-label="closeDaily" autofocus>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
        </button>
      </form>
    </div>
    <div class="daily-stats" aria-label="Daily statistics" data-i18n-label="statistics">
      <div class="stat today">
        <span class="stat-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="6" width="16" height="15" rx="2"/>
            <path d="M8 3v5m8-5v5M4 11h16"/>
          </svg>
          <span data-i18n="today">Today</span>
        </span>
        <strong id="dailyToday">0 / 5</strong>
      </div>
      <div class="stat total">
        <span class="stat-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 4h10v7a5 5 0 0 1-10 0V4Zm0 2H3v2a4 4 0 0 0 4 4m10-6h4v2a4 4 0 0 1-4 4m-5 4v4m-4 0h8"/>
          </svg>
          <span data-i18n="total">Total</span>
        </span>
        <strong id="dailyTotal">0</strong>
      </div>
    </div>
    <ol class="daily-list" id="dailyList" aria-label="Today's zikr" data-i18n-label="todayZikr"></ol>
  </dialog>

          <details class="info-card guide-topic" name="guide-topic">
            <summary><span class="guide-icon" aria-hidden="true">↻</span><span data-i18n="freestyleGuide">About Freestyle mode</span></summary>
            <div class="guide-topic-content">
              <ol class="guide-steps">
                <li data-i18n="freeStep1"></li>

          <details class="info-card guide-topic" name="guide-topic">

            <div class="guide-topic-content">

              </div>

            <div class="guide-topic-content">
              <ol class="guide-steps install-steps">

                      <path d="m771 114 66-36m-26 0h26l-13 23"/>

                </li>

                  <p data-i18n="installStep2"></p>

                      <path d="m771 220-132 66m30 0h-30l16-25"/>

                    <img src="install-guide/confirm-install.webp" width="680" height="385" loading="lazy" alt="">

            <div class="guide-topic-content">

            </div>

        </div>
      </div>

  <audio id="freestyleSound" src="freestyle-chime.wav" preload="auto"></audio>
